<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="1100" height="680" style="background:#0f172a; font-family:system-ui, -apple-system, sans-serif;">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.8" />
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <rect width="1100" height="680" fill="#0f172a" />
  <rect width="1100" height="680" fill="url(#grid)" />

  <!-- Title Banner -->
  <text x="60" y="32" fill="#93c5fd" font-size="14" font-weight="bold" font-family="monospace">
    UML 2.0 COMPONENT DIAGRAM: SELF-SERVICE COFFEE KIOSK SYSTEM (LAYERED ARCHITECTURE)
  </text>

  <!-- Presentation Layer -->
  <rect x="50" y="45" width="1000" height="165" rx="8" fill="rgba(30, 58, 138, 0.15)" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,4" />
  <text x="70" y="68" fill="#60a5fa" font-size="12" font-weight="bold">PRESENTATION LAYER (User Touch Interface &amp; Interaction)</text>

  <!-- Business Layer -->
  <rect x="50" y="235" width="1000" height="225" rx="8" fill="rgba(16, 185, 129, 0.08)" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,4" />
  <text x="70" y="258" fill="#34d399" font-size="12" font-weight="bold">BUSINESS LOGIC LAYER (Orchestration, Payment Security &amp; Hardware Spooling)</text>

  <!-- Data Layer -->
  <rect x="50" y="485" width="1000" height="165" rx="8" fill="rgba(217, 119, 6, 0.08)" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,4" />
  <text x="70" y="508" fill="#fbbf24" font-size="12" font-weight="bold">DATA / PERSISTENCE LAYER (Local SQLite Catalog &amp; Sales Audit Log)</text>

  <!-- Connectors -->
  <!-- UI to Order Manager -->
  <line x1="550" y1="190" x2="550" y2="280" stroke="#64748b" stroke-width="2" />
  <circle cx="550" cy="235" r="7" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" />
  <path d="M 539 232 A 11 11 0 0 0 561 232" fill="none" stroke="#38bdf8" stroke-width="2.5" />
  <rect x="565" y="222" width="135" height="24" rx="4" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
  <text x="572" y="238" fill="#93c5fd" font-size="11" font-weight="bold" font-family="monospace">IOrderPlacement</text>

  <!-- Order Manager to Payment Service -->
  <line x1="350" y1="345" x2="420" y2="345" stroke="#64748b" stroke-width="2" />
  <circle cx="380" cy="345" r="7" fill="#1e293b" stroke="#d97706" stroke-width="2.5" />
  <path d="M 382 334 A 11 11 0 0 1 382 356" fill="none" stroke="#d97706" stroke-width="2.5" />
  <rect x="305" y="365" width="145" height="22" rx="4" fill="#1e293b" stroke="#d97706" stroke-width="1" />
  <text x="312" y="380" fill="#fcd34d" font-size="11" font-weight="bold" font-family="monospace">IPaymentProcessing</text>

  <!-- Order Manager to Receipt Printer -->
  <line x1="680" y1="345" x2="750" y2="345" stroke="#64748b" stroke-width="2" />
  <circle cx="715" cy="345" r="7" fill="#1e293b" stroke="#9333ea" stroke-width="2.5" />
  <path d="M 713 334 A 11 11 0 0 0 713 356" fill="none" stroke="#9333ea" stroke-width="2.5" />
  <rect x="670" y="365" width="115" height="22" rx="4" fill="#1e293b" stroke="#9333ea" stroke-width="1" />
  <text x="678" y="380" fill="#e9d5ff" font-size="11" font-weight="bold" font-family="monospace">IReceiptPrint</text>

  <!-- Order Manager to Database -->
  <line x1="550" y1="410" x2="550" y2="510" stroke="#64748b" stroke-width="2" />
  <circle cx="550" cy="460" r="7" fill="#1e293b" stroke="#059669" stroke-width="2.5" />
  <path d="M 539 462 A 11 11 0 0 1 561 462" fill="none" stroke="#059669" stroke-width="2.5" />
  <rect x="565" y="445" width="180" height="24" rx="4" fill="#1e293b" stroke="#059669" stroke-width="1" />
  <text x="572" y="461" fill="#a7f3d0" font-size="11" font-weight="bold" font-family="monospace">IMenuCatalog &amp; IDataStore</text>

  <!-- Touchscreen UI Component -->
  <g transform="translate(420, 80)">
    <rect width="260" height="110" rx="4" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
    <g transform="translate(228, 10)">
      <rect x="4" y="0" width="20" height="24" fill="#0f172a" stroke="#3b82f6" stroke-width="1.2" rx="1" />
      <rect x="0" y="4" width="8" height="5" fill="#334155" stroke="#3b82f6" stroke-width="1.2" />
      <rect x="0" y="14" width="8" height="5" fill="#334155" stroke="#3b82f6" stroke-width="1.2" />
    </g>
    <text x="130" y="24" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="monospace">&lt;&lt;component&gt;&gt;</text>
    <text x="130" y="44" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="bold">Touchscreen UI Component</text>
    <line x1="12" y1="54" x2="248" y2="54" stroke="#334155" stroke-width="0.8" />
    <text x="14" y="72" fill="#94a3b8" font-size="10">Customer menu choice (Espresso, Latte, etc.)</text>
    <text x="14" y="88" fill="#94a3b8" font-size="10">Size modifiers &amp; payment authorization UI</text>
  </g>

  <!-- Payment Service Component -->
  <g transform="translate(100, 280)">
    <rect width="250" height="120" rx="4" fill="#1e293b" stroke="#d97706" stroke-width="2" />
    <g transform="translate(218, 10)">
      <rect x="4" y="0" width="20" height="24" fill="#0f172a" stroke="#d97706" stroke-width="1.2" rx="1" />
      <rect x="0" y="4" width="8" height="5" fill="#334155" stroke="#d97706" stroke-width="1.2" />
      <rect x="0" y="14" width="8" height="5" fill="#334155" stroke="#d97706" stroke-width="1.2" />
    </g>
    <text x="125" y="24" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="monospace">&lt;&lt;component&gt;&gt;</text>
    <text x="125" y="44" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="bold">Payment Service Component</text>
    <line x1="12" y1="54" x2="238" y2="54" stroke="#334155" stroke-width="0.8" />
    <text x="14" y="72" fill="#94a3b8" font-size="10">Credit Card Only EMV Chip/NFC Interface</text>
    <text x="14" y="88" fill="#94a3b8" font-size="10">PCI-DSS Tokenization &amp; Bank Auth</text>
  </g>

  <!-- Order Manager Component -->
  <g transform="translate(420, 280)">
    <rect width="260" height="120" rx="4" fill="#1e293b" stroke="#059669" stroke-width="2" />
    <g transform="translate(228, 10)">
      <rect x="4" y="0" width="20" height="24" fill="#0f172a" stroke="#059669" stroke-width="1.2" rx="1" />
      <rect x="0" y="4" width="8" height="5" fill="#334155" stroke="#059669" stroke-width="1.2" />
      <rect x="0" y="14" width="8" height="5" fill="#334155" stroke="#059669" stroke-width="1.2" />
    </g>
    <text x="130" y="24" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="monospace">&lt;&lt;component&gt;&gt;</text>
    <text x="130" y="44" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="bold">Order Manager Component</text>
    <line x1="12" y1="54" x2="248" y2="54" stroke="#334155" stroke-width="0.8" />
    <text x="14" y="72" fill="#94a3b8" font-size="10">State Orchestration &amp; Pricing Math</text>
    <text x="14" y="88" fill="#94a3b8" font-size="10">Coordinates Payment, Printer, &amp; DB</text>
  </g>

  <!-- Receipt Printer Component -->
  <g transform="translate(750, 280)">
    <rect width="250" height="120" rx="4" fill="#1e293b" stroke="#9333ea" stroke-width="2" />
    <g transform="translate(218, 10)">
      <rect x="4" y="0" width="20" height="24" fill="#0f172a" stroke="#9333ea" stroke-width="1.2" rx="1" />
      <rect x="0" y="4" width="8" height="5" fill="#334155" stroke="#9333ea" stroke-width="1.2" />
      <rect x="0" y="14" width="8" height="5" fill="#334155" stroke="#9333ea" stroke-width="1.2" />
    </g>
    <text x="125" y="24" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="monospace">&lt;&lt;component&gt;&gt;</text>
    <text x="125" y="44" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="bold">Receipt Printer Component</text>
    <line x1="12" y1="54" x2="238" y2="54" stroke="#334155" stroke-width="0.8" />
    <text x="14" y="72" fill="#94a3b8" font-size="10">ESC/POS Thermal Driver Spooling</text>
    <text x="14" y="88" fill="#94a3b8" font-size="10">Prints Order Details &amp; Auth Slip</text>
  </g>

  <!-- Database Component -->
  <g transform="translate(420, 520)">
    <rect width="260" height="110" rx="4" fill="#1e293b" stroke="#b45309" stroke-width="2" />
    <g transform="translate(228, 10)">
      <rect x="4" y="0" width="20" height="24" fill="#0f172a" stroke="#b45309" stroke-width="1.2" rx="1" />
      <rect x="0" y="4" width="8" height="5" fill="#334155" stroke="#b45309" stroke-width="1.2" />
      <rect x="0" y="14" width="8" height="5" fill="#334155" stroke="#b45309" stroke-width="1.2" />
    </g>
    <text x="130" y="24" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="monospace">&lt;&lt;component&gt;&gt;</text>
    <text x="130" y="44" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="bold">Database Component</text>
    <line x1="12" y1="54" x2="248" y2="54" stroke="#334155" stroke-width="0.8" />
    <text x="14" y="72" fill="#94a3b8" font-size="10">Menu Items (Espresso, Latte, Americano)</text>
    <text x="14" y="88" fill="#94a3b8" font-size="10">Drink Size Pricing &amp; Order Audit Logs</text>
  </g>

  <!-- Legend -->
  <g transform="translate(60, 615)">
    <rect x="0" y="0" width="350" height="32" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="20" cy="16" r="5" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5" />
    <text x="32" y="20" fill="#f8fafc" font-size="10">Ball: Provided Interface</text>
    <path d="M 160 9 A 7 7 0 0 1 160 23" fill="none" stroke="#38bdf8" stroke-width="2" />
    <text x="175" y="20" fill="#f8fafc" font-size="10">Socket: Required Interface</text>
    <rect x="295" y="12" width="8" height="8" fill="#64748b" stroke="#fff" stroke-width="1" />
    <text x="310" y="20" fill="#f8fafc" font-size="10">Port</text>
  </g>
</svg>
